<style>
:root{--main:#1f6f5f;--main2:#175347;--ink:#222;--sub:#666;--line:#d9d9d9;--head:#f0f3f2;--up:#d0021b;--down:#1a5fb4;--hot:#fff8e1;--card:#fff;--bg:#f3f5f4}
*{box-sizing:border-box}

main{padding:8px 8px 40px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card h2{margin:0 0 6px;font-size:13px;color:var(--main);border-bottom:1px solid var(--line);padding-bottom:4px}

.day{font-size:17px;font-weight:700}

.plan{font-size:12px;color:var(--sub);margin-top:2px}

.pbox .d{font-size:11px;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}

.sig.inv{color:var(--down);border-color:var(--down);background:#f0f5fc}

.gauge b{position:absolute;top:-2px;width:2px;height:12px;background:#222}
.note{font-size:11px;color:var(--sub);margin-top:4px}
.res{margin-top:6px;padding:6px 8px;background:var(--hot);border-radius:6px;font-size:12px}

th{background:var(--head);color:#333;font-weight:600;font-size:11px;padding:4px 3px;border-bottom:1px solid var(--line);white-space:nowrap}

td.l{text-align:left;white-space:normal}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
.star{font-weight:700}
.bar{display:inline-block;height:9px;vertical-align:middle;border-radius:2px}
.bar.p{background:var(--up)}.bar.m{background:var(--down)}

.sbox .k{font-size:10px;color:var(--sub)}
.sbox .v{font-size:13px;font-weight:700}
.sbox .s{font-size:11px;color:var(--sub)}
.kind{font-size:10px;color:var(--sub)}
details summary{cursor:pointer;font-size:12px;color:var(--main);margin:4px 0}
.empty{padding:20px;text-align:center;color:var(--sub)}
.top{position:sticky;top:0;z-index:5;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.top .gh{position:static;box-shadow:none}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line)}
.tabs a{flex:1;text-align:center;padding:9px 4px;font-size:13px;font-weight:700;color:var(--sub);text-decoration:none;border:0;border-bottom:3px solid transparent;border-radius:0}
.mood{border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:12px;line-height:1.6}

.mood.bad{background:#eef3fb;border-left:4px solid var(--down)}

.tabs a.on{color:var(--main);border-bottom-color:var(--main)}
</style>

        + `<div><div class="kind">モデルの点数</div><div class="prob" style="font-size:26px">${(Q.prob*100).toFixed(0)}<small> 点</small></div></div></div>`;
  s += `<div class="gauge"><i style="width:100%"></i><b style="left:${(Q.prob*100).toFixed(1)}%"></b></div>`;
  s += `<div class="note">${skip} 点未満なら見送り、それ以外はブル（インバースは勧めない。夜は上がりやすく、インバースを混ぜると 2 年でも 14 年でも成績が下がったため）。</div>`;
  const T = Q.track;
  if (T) s += `<div class="res">📊 点数が今日と近かった日（${(T.lo*100).toFixed(0)}〜${(T.hi*100).toFixed(0)} 点）は、過去 <b>${T.n} 日中 ${(T.up*100).toFixed(0)}%</b> で 1570 が上がった（平均 <b class="${cls(T.mean)}">${pct(T.mean)}</b>）。`
     + `<span class="kind">全部の日では ${(T.base_up*100).toFixed(0)}%・平均 ${pct(T.base_mean)}</span></div>`;
  return s;
}
function materialsTable(list){
  let s = `<table><tr><th class="l">材料</th><th class="r">今日の値</th><th class="c">押し引き</th></tr>`;
  const maxPush = Math.max(0.01, ...list.map(m => Math.abs(m.push)));
  list.forEach(m => {
    const w = Math.abs(m.push) / maxPush * 40;
    const bar = m.push >= 0 ? `<span class="bar p" style="left:50%;width:${w}px"></span>` : `<span class="bar m" style="left:calc(50% - ${w}px);width:${w}px"></span>`;
    s += `<tr><td class="l">${esc(m.label)}</td><td class="r">${esc(m.value)}</td><td class="c"><span class="barwrap"><i></i>${bar}</span> <span class="kind ${cls(m.push)}">${m.push >= 0 ? '+' : ''}${m.push.toFixed(2)}</span></td></tr>`;
  });
  return s + `</table>`;
}
function sumbox(title, s, note){
  if (!s) return `<div class="sbox"><div class="k">${title}</div><div class="v">まだ無し</div><div class="s">${note||''}</div></div>`;
  const tm = s.trade_mean === null ? '-' : pct(s.trade_mean);
  const sk = s.skip_mean === null ? '-' : pct(s.skip_mean);
  return `<div class="sbox"><div class="k">${title}　${s.n}日</div>`
       + `<div class="v">モデルどおり 通算 <span class="${cls(s.model_total)}">${pct(s.model_total,1)}</span></div>`
       + `<div class="s">毎日ブルなら 通算 <b class="${cls(s.bull_total)}">${pct(s.bull_total,1)}</b></div>`
       + `<div class="s">ブルの日 ${s.n_trade}日: 上昇 ${s.trade_hit === null ? '-' : (s.trade_hit*100).toFixed(0)+'%'}・平均 ${tm}</div>`
       + `<div class="s">見送りの日 ${s.n_skip}日: その日の 1570 平均 ${sk}<span class="kind">（マイナスなら見送って正解）</span></div>`
       + `<div class="s">最大下落 モデル ${(s.model_dd*100).toFixed(0)}% / 毎日ブル ${(s.bull_dd*100).toFixed(0)}%</div>`
       + `<div class="s">${note||''}</div></div>`;
}
function recentTable(list, label){
  let s = `<table><tr><th>日付</th><th class="r">点数</th><th>判断</th><th class="r">${label}</th><th class="r">ブル</th><th class="r">インバ</th><th class="c">当り</th></tr>`;
  list.forEach(r => {
    const sc = r.signal === 'ブル' ? 'up' : (r.signal === 'インバース' ? 'down' : '');
    // 見送りの日: 1570 が下がっていれば「見送って正解」の ○、上がっていれば × と数える
    const hit = r.ret_n === null ? '' : (r.hit === 1 ? '○' : (r.hit === 0 ? '×' : (r.ret_bull < 0 ? '<span class="kind">見○</span>' : '<span class="kind">見×</span>')));
    s += `<tr><td>${r.date.slice(5)} <span class="kind">${r.kind === '本物' ? '' : r.kind}</span></td><td class="r">${(r.prob*100).toFixed(0)}</td><td class="${sc}">${esc(r.signal)}</td>`

     + `夜は上がりやすい（1570 がプラス 55%）という下地があり、それ以上の予想の力は見つかっていない。上の「目印」のほうが 14 年分の裏付けがある。</div></div>`;

  h += `<div class="card eve"><h2>夕方の予想の成績（記録）</h2><div class="sum">${sumbox('本物（夕方に出した予想）', sm.genuine, '毎日の記録はここに溜まる')}${sumbox('遡り（過去を後から採点）', sm.backfill, '未来を見ずに学習し直した参考値')}</div>`
     + recentTable(RC.recent, '日経') + `<div class="note">日経 = 終値→翌朝 9:00 の日経平均。ブル・インバ = 買値の目安→翌朝 9:00 の ETF。当り = ブルの日は 1570 がプラスなら ○。見送りの日は 1570 が下がれば「見○」（見送って正解）、上がれば「見×」。`
     + `${D.model.since} にモデルを ${esc(D.model.version)} に変えた。それより前の本物の記録（v1）は別に保管している。</div></div>`;
  return h;
}

if (D.flags.exdiv_eve) chips.push('<span class="chip">配当の権利付き最終日：日経平均は明朝配当落ちで下がるが、1570 は先物運用なので はっきりとは下がらない（14年28回で夜の平均 −0.15%）</span>');
if (D.flags.month_first) chips.push('<span class="chip good">月の第1営業日</span>');
if (D.hold_days >= 4) chips.push('<span class="chip">連休またぎ</span>');
if (D.flags.streak <= -2) chips.push(`<span class="chip">昨日まで${-D.flags.streak}日連続下げ</span>`);
if (D.flags.streak >= 3) chips.push(`<span class="chip">昨日まで${D.flags.streak}日連続上げ</span>`);
if (chips.length) h += `<div class="chips">${chips.join('')}</div>`;
h += `<div class="prices">
  <div class="pbox"><div class="k">前日終値</div><div class="v">${num(P.n_prev_close, 0)}</div><div class="d">&nbsp;</div></div>
  <div class="pbox"><div class="k">寄り付き 9:00</div><div class="v">${num(P.n_open, 0)}</div><div class="d ${cls(chg(P.n_open,P.n_prev_close))}">${pct(chg(P.n_open,P.n_prev_close))}</div></div>
  <div class="pbox"><div class="k">前場終値 11:30</div><div class="v">${num(P.n_am_close, 0)}</div><div class="d ${cls(chg(P.n_am_close,P.n_prev_close))}">${pct(chg(P.n_am_close,P.n_prev_close))}</div></div>
</div>`;
h += `<div class="etf">
  <div class="pbox"><div class="k">1570 ダブルブル 前場終値</div><div class="v">${num(P.bull_am_close, 0)} 円</div><div class="d ${cls(chg(P.bull_am_close,P.bull_prev_close))}">${pct(chg(P.bull_am_close,P.bull_prev_close))}</div></div>
  <div class="pbox"><div class="k">1357 ダブルインバース 前場終値</div><div class="v">${num(P.inv_am_close, 0)} 円</div><div class="d ${cls(chg(P.inv_am_close,P.inv_prev_close))}">${pct(chg(P.inv_am_close,P.inv_prev_close))}</div></div>
</div>`;
if (R) h += `<div class="res">結果: 日経 12:30→翌朝 <b class="${cls(R.ret_n)}">${pct(R.ret_n)}</b>　ダブルブル <b class="${cls(R.ret_bull)}">${pct(R.ret_bull)}</b>　ダブルインバース <b class="${cls(R.ret_inv)}">${pct(R.ret_inv)}</b></div>`;
else if (P.n_pm_open) h += `<div class="res">後場寄り付き ${num(P.n_pm_open,0)}（結果は ${md(D.sell_date)} の朝）</div>`;
h += `</div>`;

// ---- 上がる確率
const Q = D.pred;
h += `<div class="card"><h2>今日の判断（昼のモデル ${esc(D.model.version)}・参考）</h2>` + verdictBlock(Q);
if (Q) {
  h += `<div class="note">`
     + `${Q.kind === '本物' ? '12:30 前に記録した予想' : (Q.kind === '遅れ' ? '12:30 より後に出した予想（成績には別枠で数える）' : (Q.kind === '遡り' ? '過去を後から採点したもの' : ''))}`
     + `${Q.time && Q.kind !== '遡り' ? '（' + esc(Q.time.slice(5)) + '）' : ''}。学習 ${Q.n_train} 日・材料 16 個。</div>`;
  h += `<div class="note">※ 予想の力は弱い（14 年分で試しても、当てる力は偶然よりわずかに上の程度）。過去 2 年では「たまに見送る」ことで毎日ブルより成績が良かったが、偶然でないとまでは言えない。売買は自分で判断する。</div>`;
}
h += `</div>`;

// ---- 強い夜・落ち着いた夜の目印（1570 の 14 年実績）
h += nightFlagsCard(D.night_flags, 'card', '🔥 強い夜・落ち着いた夜の目印');

// ---- 売り方の目安（朝 9:00 に売るか・昼まで持つか・持ち越すか）
h += sellingGuideCard(D.selling_guide, D.sell_date, D.sell_wd, 'card');

// ---- 重要イベント・注意日と基礎知識
h += eventsAndTipsCard(D.events, 'card');

// ---- 仕組み
const S = D.structural;
h += `<div class="card"><h2>仕組みの追い風・向かい風（今日に当てはまる条件）</h2>`;
S.items.forEach(it => {
  const a = it.all, r = it.recent;
  const per = a.periods.map(x => x === null ? '-' : (x*100).toFixed(0)).join(' / ');
  const mark = a.mark ? `<span class="star ${a.mark.includes('↑') ? 'up' : 'down'}">${a.mark}</span>` : '';
  h += `<div class="cond"><div class="cl">${esc(it.label)} ${mark}</div><div class="cg">`
     + `<div><div class="k">${S.years[0]}〜${S.years[1]}年 夜間↑</div><div class="v">${(a.up*100).toFixed(1)}% <span class="kind">${a.n}回</span></div><div class="kind">${(a.lo*100).toFixed(0)}〜${(a.hi*100).toFixed(0)}%・平均 ${pct(a.mean)}</div></div>`
     + `<div><div class="k">期間別 04-09/10-15/16-21/22-</div><div class="v kind">${per}</div></div>`
     + `<div><div class="k">直近2年の実際の売買</div>${r ? `<div class="v">${(r.up*100).toFixed(0)}% <span class="kind">${r.n}回</span></div><div class="kind">ブル平均 ${pct(r.bull_mean)}</div>` : '<div class="v">-</div>'}</div>`
     + `</div></div>`;
});
h += `<div class="note">夜間 = その日の終値 → 翌朝の寄り付き（この売買の大部分）。★ = 全部の日（${(S.base.up*100).toFixed(1)}%）と 95% の範囲で差がある。`
   + `期間別で 4 つそろって同じ向きなら信用しやすい。「連続」「前日の騰落」は昨日の終値までの話。</div></div>`;

// ---- 材料
h += `<div class="card"><h2>昼の材料と、モデルの押し引き</h2>` + materialsTable(D.materials);
h += `<div class="note">押し引き = その材料がモデルの点数をどちらへ動かしたか（赤＝上げる方向、青＝下げる方向）。</div>`;
if (D.extras && D.extras.length) {
  h += `<details><summary>モデルに入れていない参考の材料（ハイテク株・TOPIX とのズレ・米先物）</summary><table>`;
  D.extras.forEach(e => { const v = parseFloat(e.value); h += `<tr><td class="l">${esc(e.label)}</td><td class="r ${isNaN(v) ? '' : cls(v)}">${esc(e.value)}</td></tr>`; });
  h += `</table><div class="note">2年分の検証ではどれも的中 50% 前後で、モデルに足しても良くならなかった（walk_eval.txt）。目で見る用。</div></details>`;
}
h += `</div>`;

// ---- 成績
const RC = D.record, sm = RC.summary;
h += `<div class="card"><h2>昼の予想の成績（記録）</h2>`;
h += `<div class="sum">${sumbox('本物（12:30 前の予想）', sm.genuine, '毎日の記録はここに溜まる')}${sumbox('遡り（過去を後から採点）', sm.backfill, '未来を見ずに学習し直した参考値')}</div>`;
h += recentTable(RC.recent, '日経');
h += `<div class="note">当り = ブルの日は 1570 が 12:30→翌朝 でプラスなら ○。見送りの日は 1570 が下がれば「見○」（見送って正解）、上がれば「見×」。通算は往復コスト ${(RC.cost*100).toFixed(2)}% を引いた複利。日経平均の「始値」は 9:00 にまだ寄っていない銘柄の前日終値を含む古い値なので、ETF と向きが違う日がある（成績は ETF で数える）。`
   + `<br>${D.model.since} にモデルを ${esc(D.model.version)} に変えた（材料 16 個・1570 の向きを学ぶ・インバースは勧めない）。それより前の本物の記録（v1）は別に保管している。</div></div>`;
return h;
}

// ================= マーケットの一覧と地合いの一言（昼・夜どちらのページにも上に出す）
function spark(a, up){
  if (!a || a.length < 2) return '';
  const lo = Math.min(...a), hi = Math.max(...a), w = 70, ht = 18, r = (hi - lo) || 1;
  const pts = a.map((v, i) => `${(i / (a.length - 1) * w).toFixed(1)},${(ht - 1 - (v - lo) / r * (ht - 2)).toFixed(1)}`).join(' ');
  return `<svg class="spk" viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${up ? 'var(--up)' : 'var(--down)'}" stroke-width="1.4"/></svg>`;
}
function renderMarket(){
  const M = D.market;
  if (!M) return '';
  const md_ = M.mood;
  let h = `<div class="card mkt"><h2>🌐 今のマーケット</h2>`;
  h += `<div class="mood ${md_.level}"><div class="mh">${md_.level === 'good' ? '🌤️' : (md_.level === 'bad' ? '🌧️' : '⛅')} ${esc(md_.head)}</div>`;
  if (md_.good.length) h += `<div class="ml">${md_.good.map(s => `<span class="up">＋</span> ${esc(s)}`).join('<br>')}</div>`;
  if (md_.bad.length) h += `<div class="ml">${md_.bad.map(s => `<span class="down">－</span> ${esc(s)}`).join('<br>')}</div>`;
  if (md_.plain.length) h += `<div class="ml">${md_.plain.map(s => `・ ${esc(s)}`).join('<br>')}</div>`;
  h += `</div><div class="tiles">`;
  M.items.forEach(x => {
    const ch = x.kind === 'pt' ? `${x.diff >= 0 ? '+' : ''}${x.diff.toFixed(2)}` : pct(x.chg);
    const up = x.spark[x.spark.length - 1] >= x.spark[0];
    h += `<div class="tile"><div class="k">${esc(x.name)}</div><div class="v">${num(x.close, x.dec)}<small>${esc(x.unit)}</small></div>`
       + `<div class="d"><span class="${cls(x.chg)}">${ch}</span> <span class="kind">${md(x.date)}</span></div>${spark(x.spark, up)}</div>`;
  });
  h += `</div><div class="note">地合いの一言は、上の数字から決まった基準で作った「いまの全体の雰囲気」です。明日の上げ下げの予想ではありません（予想は下の「今日の判断」）。小さな線は直近 20 営業日の動き。米国の数字は前の晩の終値です。</div></div>`;
  return h;
}

const PAGE = 'noon';
document.getElementById('t_' + PAGE).className = 'on';
let h = renderMarket();
if (PAGE === 'eve') {
  h += D.eve ? renderEve() : `<div class="card"><div class="empty">夜の予想はまだありません（18:05 ごろに作られます）</div></div>`;
  h += `<div class="note">データ: Yahoo Finance・JPX（手口）。夜の予想は 18:05 ごろ自動更新。売買は自己判断で。</div>`;
} else {
  h += renderNoon();
  h += `<div class="note">データ: Yahoo Finance（1時間足・日足）・日経公式（前場終値）。昼は 11:35 ごろ自動更新。売買は自己判断で。</div>`;
}
main.innerHTML = h;
</script>
<script data-goatcounter="https://dax888333.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
