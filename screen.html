<script>
const D = JSON.parse(document.getElementById('data').textContent);
const main = document.getElementById('main');
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pct(v, d){ if (v === null || v === undefined) return '-'; const s = (v*100).toFixed(d === undefined ? 1 : d); return (v > 0 ? '+' : '') + s + '%'; }
function cls(v){ return v > 0 ? 'up' : (v < 0 ? 'down' : ''); }
function num(v, d){ return (v === null || v === undefined) ? '-' : v.toLocaleString('ja-JP', {minimumFractionDigits: d, maximumFractionDigits: d}); }
function md(s){ return s ? (parseInt(s.slice(5,7),10) + '/' + parseInt(s.slice(8,10),10)) : ''; }
let h = '';
h += `<div class="card"><h2>${esc(D.latest)} 時点<span>更新 ${esc(D.updated.slice(5))}・${D.n_stocks} 銘柄・直近 ${D.days} 営業日（${md(D.recent_dates[0])}〜${md(D.recent_dates[D.recent_dates.length-1])}）</span></h2>`;
h += `<div class="sum">
  <div class="sbox"><div class="k">今日の GC</div><div class="v up">${D.today.gc}</div></div>
  <div class="sbox"><div class="k">今日の DC</div><div class="v down">${D.today.dc}</div></div>
  <div class="sbox"><div class="k">上昇並び<br><small>終値&gt;5&gt;25&gt;75日線</small></div><div class="v">${D.state.above_all}</div></div>
  <div class="sbox"><div class="k">下落並び<br><small>終値&lt;5&lt;25&lt;75日線</small></div><div class="v">${D.state.below_all}</div></div>
</div><div class="note">GC = ゴールデンクロス（短い移動平均線が長い線を上抜け）、DC = デッドクロス（下抜け）。移動平均は終値の単純平均。</div></div>`;

// 持ち株・気になる銘柄（watchlist.json → 53_watch.py）
if (D.watch && D.watch.items && D.watch.items.length) {
  const W = D.watch, T = W.total;
  const hold = W.items.filter(x => x.kind === 'holding' && x.holding && x.holding.shares);
  const watch = W.items.filter(x => !(x.kind === 'holding' && x.holding && x.holding.shares));
  h += `<div class="card mine"><h2>🏠 持ち株・気になる銘柄<span>更新 ${esc(W.updated.slice(5))}</span></h2>`;
  if (T.cost) {
    h += `<div class="sum" style="grid-template-columns:repeat(3,1fr)">
      <div class="sbox"><div class="k">評価額</div><div class="v">${num(T.value,0)}円</div></div>
      <div class="sbox"><div class="k">取得額</div><div class="v">${num(T.cost,0)}円</div></div>
      <div class="sbox"><div class="k">損益</div><div class="v ${cls(T.pl)}">${T.pl>=0?'+':''}${num(T.pl,0)}円<br><span style="font-size:12px">${pct(T.pl_pct)}</span></div></div>
    </div>`;
  }
  const rowOf = (x, withPL) => {
    const s = x.signals.length ? x.signals.map(t => `<span class="tag sig">${esc(t.split('（')[0])}</span>`).join(' ') : '';
    const d = x.div ? `${esc(x.div.next_est.slice(5))}` : '-';
    return `<tr><td class="l"><span class="nm">${esc(x.name)}</span><span class="sub">${esc(x.code)}${x.memo ? '・' + esc(x.memo) : ''} ${s}</span></td>`
      + `<td class="r">${num(x.close,0)}</td><td class="r ${cls(x.chg)}">${pct(x.chg)}</td>`
      + (withPL ? `<td class="r ${cls(x.holding.pl)}">${x.holding.pl>=0?'+':''}${num(x.holding.pl,0)}<span class="sub ${cls(x.holding.pl_pct)}">${pct(x.holding.pl_pct)}</span></td>` : `<td class="r ${cls(x.ret_20d)}">${pct(x.ret_20d)}</td>`)
      + `<td class="r ${cls(x.dev25)}">${pct(x.dev25)}</td><td class="r">${x.rsi === null ? '-' : x.rsi.toFixed(0)}</td>`
      + `<td class="c">${x.above200 === null ? '-' : (x.above200 ? '<span class="tag trend">上</span>' : '<span class="tag ctr">下</span>')}</td>`
      + `<td class="r kind">${d}</td></tr>`;
  };
  if (hold.length) {
    h += `<table><tr><th class="l">持ち株</th><th class="r">現在値</th><th class="r">前日比</th><th class="r">損益</th><th class="r">25日線</th><th class="r">RSI</th><th class="c">200日</th><th class="r">配当<br><small>見込</small></th></tr>`;
    hold.forEach(x => h += rowOf(x, true));
    h += `</table>`;
  }
  if (watch.length) {
    h += `<table style="margin-top:8px"><tr><th class="l">気になる銘柄</th><th class="r">現在値</th><th class="r">前日比</th><th class="r">20日間</th><th class="r">25日線</th><th class="r">RSI</th><th class="c">200日</th><th class="r">配当<br><small>見込</small></th></tr>`;
    watch.forEach(x => h += rowOf(x, false));
    h += `</table>`;
  }
  const back = hold.filter(x => x.dev25 >= 0);
  if (back.length) h += `<div class="note">📌 25日線に戻った持ち株: <b>${back.map(x => esc(x.name)).join('、')}</b>　（下げたところで買った株は「25日線に戻ったら売る」が 22 年で一番安定していました。下の「売り方の目安」を参照）</div>`;
  if (W.alerts && W.alerts.length) h += `<div class="note">今日の知らせ: ${W.alerts.map(esc).join(' / ')}</div>`;
  h += `<div class="note">登録は パソコンの watchlist.json（メモ帳で開ける）。配当は前回の権利落ちから見込んだ日付。</div></div>`;
}

// 誰が買い越し・売り越しか（JPX 投資部門別・週間）
if (D.investor && D.investor.weeks && D.investor.weeks.length) {
  const I = D.investor, last = I.weeks[I.weeks.length - 1];
  const f = last.cats['海外投資家'];
  h += `<div class="card inv"><h2>誰が買い越しているか<span>${esc(I.market)}・週間・単位 ${esc(I.unit)}（更新 ${esc(I.updated.slice(5))}）</span></h2>`;
  if (f) h += `<div class="note" style="font-size:13px">最新の週（${md(last.start)}〜${md(last.end)}）: 海外投資家は <b class="${cls(f.net)}">${f.net>=0?'買い越し':'売り越し'} ${num(Math.abs(f.net),0)} ${esc(I.unit)}</b></div>`;
  h += `<table><tr><th class="l">週</th>` + I.cats.map(c => `<th class="r">${esc(c)}</th>`).join('') + `</tr>`;
  I.weeks.slice().reverse().forEach(w => {
    h += `<tr><td class="l">${md(w.start)}〜${md(w.end)}</td>` + I.cats.map(c => {
      const v = w.cats[c];
      return v ? `<td class="r ${cls(v.net)}">${v.net>=0?'+':'−'}${num(Math.abs(v.net),0)}</td>` : '<td class="r">-</td>';
    }).join('') + `</tr>`;
  });
  h += `</table><div class="note">＋が買い越し、−が売り越し。毎週木曜の午後に前週分が出る（JPX 公表）。市場全体の数字で、個別の銘柄ごとではない。`
     + `JPX に置いてあるのは直近 3 か月ぶんだけなので、これ以上さかのぼれない（これから毎週ためていく）。`
     + `<b>使い方の注意</b>: 「海外投資家が買い越した週は上がった」のは同じ週の話（買うから上がる）で、次の週を当てる材料になるかはまだ分からない。週が溜まったら検証する。</div></div>`;
}

// 押し目・売られすぎ（クロスより基準との差が大きかったもの）
(D.cond_types || []).forEach(([key, label]) => {
  const list = D.conds[key];
  const st = D.history.conds[key];
  const s20 = st.all[20], b20 = D.history.base[20];
  const per = st.periods.map(x => x === null ? '-' : (x*100).toFixed(0)).join(' / ');
  h += `<div class="card cond"><h2>${esc(label)}<span>今日 ${list.length} 銘柄</span></h2>`;
  h += `<div class="note">過去 ${num(s20.n,0)} 回: 20日後に上がった <b>${(s20.up*100).toFixed(1)}%</b>（何も無い日 ${(b20.up*100).toFixed(1)}%）平均 <b class="${cls(s20.mean)}">${pct(s20.mean,2)}</b>（${pct(b20.mean,2)}）　期間別 04-09 / 10-15 / 16-21 / 22- : ${per}</div>`;
  if (!list.length) { h += `<div class="empty">今日は該当なし</div></div>`; return; }
  h += `<table><tr><th class="l">銘柄</th><th class="r">終値</th><th class="r">前日比</th><th class="r">25日線との差</th><th class="r">20日間</th><th class="r">RSI</th><th class="c">200日線</th></tr>`;
  list.forEach(x => {
    h += `<tr><td class="l"><span class="nm">${esc(x.name)}</span><span class="sub">${esc(x.code)}・${esc(x.sector)}</span></td>`
       + `<td class="r">${num(x.close,0)}</td><td class="r ${cls(x.chg)}">${pct(x.chg)}</td><td class="r ${cls(x.dev25)}">${pct(x.dev25)}</td>`
       + `<td class="r ${cls(x.ret_20d)}">${pct(x.ret_20d)}</td><td class="r">${x.rsi === null ? '-' : x.rsi.toFixed(0)}</td>`
       + `<td class="c">${x.above200 ? '<span class="tag trend">上</span>' : '<span class="tag ctr">下</span>'}</td></tr>`;
  });
  h += `</table></div>`;
});

D.types.forEach(([key, label]) => {
  const list = D.hits[key];
  const isGC = key.startsWith('gc');
  h += `<div class="card"><h2>${esc(label)}<span>${list.length} 銘柄</span></h2>`;
  if (!list.length) { h += `<div class="empty">直近 ${D.days} 営業日には無し</div></div>`; return; }
  h += `<table><tr><th>日付</th><th class="l">銘柄</th><th class="r">終値</th><th class="r">その日</th><th class="r">その後</th><th class="c">200日線</th><th class="r">出来高</th></tr>`;
  list.forEach(x => {
    const isNew = x.date === D.latest;
    const t200 = x.above200 === null ? '' : (x.above200 === isGC ? `<span class="tag trend">${isGC ? '上' : '下'}・順</span>` : `<span class="tag ctr">${x.above200 ? '上' : '下'}・逆</span>`);
    h += `<tr><td>${isNew ? '<span class="tag new">今日</span>' : md(x.date)}</td>`
       + `<td class="l"><span class="nm">${esc(x.name)}</span><span class="sub">${esc(x.code)}・${esc(x.sector)}</span></td>`
       + `<td class="r">${num(x.close,0)}</td><td class="r ${cls(x.chg)}">${pct(x.chg)}</td>`
       + `<td class="r ${cls(x.since)}">${isNew ? '-' : pct(x.since)}</td><td class="c">${t200}</td>`
       + `<td class="r">${x.vol_ratio === null ? '-' : x.vol_ratio.toFixed(1) + '倍'}</td></tr>`;
  });
  h += `</table><div class="note">その後 = クロスの日の終値から最新の終値まで。200日線 = クロスの向きと 200 日線の位置が同じなら「順」（長い流れに沿っている）、逆なら「逆」。出来高 = その日の出来高 ÷ 直近20日の平均。</div></div>`;
});

// 過去の統計
const H = D.history;
h += `<div class="card"><h2>クロスの後どうなったか<span>${D.first_year}年〜・全銘柄・全日</span></h2>`;
h += `<table><tr><th class="l">型</th><th class="r">回数</th>` + D.horizons.map(k => `<th class="r">${k}日後<br><small>上がった割合・平均</small></th>`).join('') + `</tr>`;
h += `<tr><td class="l">何も無い日（基準）</td><td class="r">${num(H.base[20].n,0)}</td>` + D.horizons.map(k => { const s = H.base[k]; return `<td class="r">${(s.up*100).toFixed(1)}%<br><span class="${cls(s.mean)}">${pct(s.mean,2)}</span></td>`; }).join('') + `</tr>`;
D.types.forEach(([key, label]) => {
  const t = H.types[key];
  const row = (name, s) => `<tr><td class="l">${name}</td><td class="r">${s[20] ? num(s[20].n,0) : '-'}</td>` + D.horizons.map(k => { const x = s[k]; if (!x) return '<td class="r">-</td>'; const b = H.base[k]; const mark = (x.lo > b.up) ? ' ★↑' : (x.hi < b.up ? ' ★↓' : ''); return `<td class="r">${(x.up*100).toFixed(1)}%${mark}<br><span class="${cls(x.mean)}">${pct(x.mean,2)}</span></td>`; }).join('') + `</tr>`;
  h += row(esc(label.split('（')[0]), t.all);
  h += row('　うち 200日線と同じ向き（順）', t.trend);
});
(D.cond_types || []).forEach(([key, label]) => {
  const t = D.history.conds[key];
  h += `<tr><td class="l">${esc(label.split('（')[0])}</td><td class="r">${num(t.all[20].n,0)}</td>` + D.horizons.map(k => { const x = t.all[k]; const b = D.history.base[k]; const mark = (x.lo > b.up) ? ' ★↑' : (x.hi < b.up ? ' ★↓' : ''); return `<td class="r">${(x.up*100).toFixed(1)}%${mark}<br><span class="${cls(x.mean)}">${pct(x.mean,2)}</span></td>`; }).join('') + `</tr>`;
});
h += `</table><div class="note">★ = 基準（何も無い日）の割合が、その型の 95% の範囲の外にある。クロスは基準と同じ＝「流れが変わったのを後から教えてくれる」だけ。押し目・急落・売られすぎは基準より 2〜4 ポイント良いが、2004〜09 年（下げ相場）では効いておらず、対象が「生き残った 225 社」なので下げてから戻った銘柄に偏っている（実際はこれより弱い）。売買コストは引いていない。売買は自己判断で。</div></div>`;

// 売り方の目安（54_exit.py）
if (D.exit && D.exit.entries) {
  const E = D.exit;
  h += `<div class="card cond"><h2>売り方の目安<span>2004年〜・買った後の出口を比べた（${esc(E.updated)}）</span></h2>`;
  h += `<table><tr><th class="l">買い方 → 売り方</th><th class="r">1回の平均<br><small>コスト後</small></th><th class="r">勝率</th><th class="r">持つ日数</th><th class="r">年率<br><small>換算</small></th></tr>`;
  Object.keys(E.entries).forEach(k => {
    const v = E.entries[k];
    if (!v.rules.length) return;
    h += `<tr><td class="l" colspan="5" style="background:#fafafa;font-weight:700">${esc(v.label)}（${num(v.n,0)} 回）</td></tr>`;
    v.rules.slice(0,3).forEach(r => {
      h += `<tr><td class="l">　${esc(r.name)}</td><td class="r ${cls(r.ret)}">${pct(r.ret,2)}</td><td class="r">${(r.win*100).toFixed(0)}%</td><td class="r">${r.days.toFixed(0)}日</td><td class="r ${cls(r.ann)}">${pct(r.ann,0)}</td></tr>`;
    });
  });
  h += `</table><div class="note">売買コスト往復 ${(E.cost*100).toFixed(1)}% を引いた数字。4 つの期間（04-09 / 10-15 / 16-21 / 22-）すべてでプラスだった売り方だけを、年率の良い順に 3 つずつ。`
     + `<br><b>大事な注意</b>　① 損切りを入れない方が成績が良く出ているが、これは「今も残っている 225 社」だけを見ているため（下げ続けて消えた会社が入っていない）。本当の下げ相場ではこの通りにならない。`
     + `② 2004〜09 年は多くの売り方でマイナス。③ 年率換算は「いつも資金が回っている」前提の目安。④ 判定は終値なので、損切りは実際はこれより不利。`
     + `<br>一番ムラが無かったのは <b>「下げたところで買い、25日線に戻ったら売る（2週間ほど）」</b>。ゴールデンクロスで買うと、どの売り方でも年率 10% 前後に落ちる。</div></div>`;
}
main.innerHTML = h;
</script>
</body>
</html>
